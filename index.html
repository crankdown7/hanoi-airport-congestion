<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>하노이(HAN) 24시간 혼잡도 (하이브리드 모델)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
    .tab-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: bold; }
    .tab-inactive { border-bottom: 4px solid transparent; color: #6b7280; }
  </style>
</head>
<body class="text-gray-800">

  <div class="max-w-6xl mx-auto p-4 md:p-8 mt-4">
    <!-- 상단 헤더 및 언어 선택 -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
      <h1 class="text-xl md:text-2xl font-bold text-gray-800" id="mainTitle">하노이(HAN) 24시간 혼잡도 (하이브리드 모델)</h1>
      <select id="langSelect" class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm font-medium text-gray-700 bg-white focus:outline-none cursor-pointer">
        <option value="ko">🇰🇷 한국어</option>
        <option value="en">🇺🇸 English</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="zh">🇨🇳 中文</option>
      </select>
    </div>

    <!-- 안내 메시지 -->
    <div id="alertNotice" class="bg-blue-50 border border-blue-100 rounded-lg p-4 mb-6 text-sm text-blue-800">
      <strong>알림:</strong> 데이터를 불러오는 중입니다...
    </div>

    <!-- 탭 UI (도착 / 출발) -->
    <div class="flex border-b border-gray-200 mb-6 w-full text-center">
      <button id="tabArrival" class="flex-1 py-3 tab-active text-lg transition-colors cursor-pointer" onclick="switchTab('arrival')">도착 (입국장)</button>
      <button id="tabDeparture" class="flex-1 py-3 tab-inactive text-lg transition-colors cursor-pointer" onclick="switchTab('departure')">출발 (출국장)</button>
    </div>

    <!-- 상단 검색/필터 영역 -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8 flex flex-col md:flex-row gap-6 items-start md:items-center justify-between">
      <div class="flex flex-col md:flex-row gap-6 items-start md:items-center w-full">
        <div class="flex flex-col">
          <label class="text-sm font-bold text-gray-700 mb-2" id="lblDate">조회할 날짜</label>
          <div class="flex gap-2">
            <input type="date" id="dateInput" class="border border-gray-300 rounded-lg px-4 py-2 w-44 focus:outline-none">
            <button id="fetchBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium shrink-0">조회</button>
          </div>
        </div>
        
        <div class="flex flex-col w-full md:w-auto md:ml-auto gap-3 mt-4 md:mt-0">
          <div class="flex items-center gap-2 bg-gray-50 px-4 py-2.5 rounded-lg border border-gray-200">
            <input type="checkbox" id="koreaFilter" class="w-4 h-4 text-blue-600 rounded cursor-pointer">
            <label for="koreaFilter" class="text-sm font-bold text-gray-700 cursor-pointer" id="lblKorea">한국 노선만 모아보기</label>
          </div>
          <div class="w-full">
            <input type="text" id="searchInput" placeholder="편명, 지역, 시간 검색" class="border border-gray-300 rounded-lg px-4 py-2 w-full md:w-72 text-sm focus:outline-none">
          </div>
        </div>
      </div>
    </div>

    <!-- 방문자 통계 카운터 영역 -->
    <div id="visitorCount" class="text-right text-xs font-bold text-gray-500 mb-2 h-4">방문자 통계 로딩 중...</div>

    <!-- 테이블 영역 -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-center whitespace-nowrap">
          <thead class="bg-gray-50 text-gray-500 text-sm border-b border-gray-100">
            <tr>
              <th class="py-4 px-4 font-medium" id="thAirline">항공사</th>
              <th class="py-4 px-4 font-medium" id="thFlight">편명</th>
              <th class="py-4 px-4 font-medium" id="thRoute">출발지/목적지</th>
              <th class="py-4 px-4 font-medium" id="thTime">도착 시간</th>
              <th class="py-4 px-4 font-medium" id="thQueue">터미널 대기열 혼잡도</th>
              <th class="py-4 px-4 font-medium" id="thCongestion">예측 유입량</th>
            </tr>
          </thead>
          <tbody id="flightsTableBody" class="divide-y divide-gray-100">
            <tr><td colspan="6" class="py-12 text-gray-400" id="tdLoading">데이터를 불러오는 중입니다...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const dict = {
      ko: {
        title: "하노이(HAN) 24시간 혼잡도 (하이브리드 모델)",
        tabArrival: "도착 (입국장)", tabDeparture: "출발 (출국장)",
        lblDate: "조회할 날짜", fetchBtn: "조회", fetchingBtn: "조회 중...",
        lblKorea: "한국 노선만 모아보기", searchPlaceholder: "편명, 지역, 시간 검색",
        thAirline: "항공사", thFlight: "편명",
        thOrigin: "출발지", thDestination: "목적지", 
        thArrTime: "도착 시간", thDepTime: "출발 시간",
        thQueue: "터미널 대기열 누적", thCongestion: "예측 혼잡 지수",
        tdLoading: "데이터를 불러오는 중입니다...", tdNoData: "일치하는 항공편이 없습니다.",
        strConcurrent: "누적 {n}대", strPredictPax: "예측 인원: {n}명",
        msgRealtime: "<strong>실시간 데이터:</strong> 오늘 날짜의 스케줄이며, 지연(Delay)이 발생한 경우 빨간색으로 표시됩니다.",
        msgFuture: "<strong>미래 예측치:</strong> 선택하신 날짜의 혼잡도는 통계 기반의 고정 예상 스케줄로 표출되며, 실제와 다를 수 있습니다."
      },
      en: {
        title: "Hanoi (HAN) 24H Congestion (Hybrid Model)",
        tabArrival: "Arrivals", tabDeparture: "Departures",
        lblDate: "Select Date", fetchBtn: "Search", fetchingBtn: "Searching...",
        lblKorea: "Korea Routes Only", searchPlaceholder: "Search flight, route, time",
        thAirline: "Airline", thFlight: "Flight",
        thOrigin: "Origin", thDestination: "Destination",
        thArrTime: "Arrival Time", thDepTime: "Departure Time",
        thQueue: "Terminal Queue", thCongestion: "Predicted Index",
        tdLoading: "Loading...", tdNoData: "No flights match the criteria.",
        strConcurrent: "Accumulated {n} flights", strPredictPax: "Predicted: {n} pax",
        msgRealtime: "<strong>Real-time Data:</strong> Today's schedule. Delays are highlighted in red.",
        msgFuture: "<strong>Future Prediction:</strong> Shows predicted schedule based on statistics. Actual times may vary."
      },
      vi: {
        title: "Tắc nghẽn đến Hà Nội (HAN) 24H (Mô hình Hybrid)",
        tabArrival: "Đến", tabDeparture: "Khởi hành",
        lblDate: "Chọn ngày", fetchBtn: "Tra cứu", fetchingBtn: "Đang tải...",
        lblKorea: "Chỉ tuyến Hàn Quốc", searchPlaceholder: "Tìm chuyến, nơi đi, giờ",
        thAirline: "Hãng HK", thFlight: "Chuyến bay",
        thOrigin: "Khởi hành", thDestination: "Điểm đến",
        thArrTime: "Giờ đến", thDepTime: "Giờ khởi hành",
        thQueue: "Tích lũy hàng đợi", thCongestion: "Chỉ số dự đoán",
        tdLoading: "Đang tải dữ liệu...", tdNoData: "Không có chuyến bay phù hợp.",
        strConcurrent: "Tích lũy {n} chuyến", strPredictPax: "Dự đoán: {n} người",
        msgRealtime: "<strong>Dữ liệu thực tế:</strong> Lịch trình hôm nay. Chuyến bay chậm trễ được hiển thị bằng màu đỏ.",
        msgFuture: "<strong>Dự đoán tương lai:</strong> Hiển thị lịch trình dự kiến dựa trên thống kê. Thực tế có thể khác."
      },
      zh: {
        title: "河内 (HAN) 24小时拥堵预测 (混合模型)",
        tabArrival: "到达", tabDeparture: "出发",
        lblDate: "选择日期", fetchBtn: "查询", fetchingBtn: "查询中...",
        lblKorea: "仅限韩国航线", searchPlaceholder: "搜索航班、出发地、时间",
        thAirline: "航空公司", thFlight: "航班号",
        thOrigin: "出发地", thDestination: "目的地",
        thArrTime: "到达时间", thDepTime: "出发时间",
        thQueue: "队列累计", thCongestion: "预测拥堵指数",
        tdLoading: "数据加载中...", tdNoData: "没有符合条件的航班。",
        strConcurrent: "累计 {n} 架次", strPredictPax: "预测人数: {n} 人",
        msgRealtime: "<strong>实时数据：</strong> 今天的航班计划。如有延误将以红色显示。",
        msgFuture: "<strong>未来预测：</strong> 基于统计的固定预测航班计划，可能与实际情况有所不同。"
      }
    };

    let currentLang = 'ko';
    let currentMode = 'arrival'; 
    let dataArrivals = [];
    let dataDepartures = [];
    let isTodayData = true; // 현재 보고 있는 데이터가 오늘인지 식별

    const offset = new Date().getTimezoneOffset() * 60000;
    document.getElementById('dateInput').value = (new Date(Date.now() - offset)).toISOString().split('T')[0];

    function applyLanguage() {
      const t = dict[currentLang] || dict['ko'];
      document.getElementById('mainTitle').innerText = t.title;
      document.getElementById('tabArrival').innerText = t.tabArrival;
      document.getElementById('tabDeparture').innerText = t.tabDeparture;
      document.getElementById('lblDate').innerText = t.lblDate;
      document.getElementById('fetchBtn').innerText = t.fetchBtn;
      document.getElementById('lblKorea').innerText = t.lblKorea;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      
      document.getElementById('thAirline').innerText = t.thAirline;
      document.getElementById('thFlight').innerText = t.thFlight;
      document.getElementById('thRoute').innerText = currentMode === 'arrival' ? t.thOrigin : t.thDestination;
      document.getElementById('thTime').innerText = currentMode === 'arrival' ? t.thArrTime : t.thDepTime;
      document.getElementById('thQueue').innerText = t.thQueue;
      document.getElementById('thCongestion').innerText = t.thCongestion;

      // 알림 메시지 다국어 처리
      const alertBox = document.getElementById('alertNotice');
      if (isTodayData) {
        alertBox.innerHTML = t.msgRealtime;
      } else {
        alertBox.innerHTML = t.msgFuture;
      }

      renderTable();
    }

    document.getElementById('langSelect').addEventListener('change', e => { currentLang = e.target.value; applyLanguage(); });

    function switchTab(mode) {
      currentMode = mode;
      document.getElementById('tabArrival').className = mode === 'arrival' ? "flex-1 py-3 tab-active text-lg transition-colors cursor-pointer" : "flex-1 py-3 tab-inactive text-lg transition-colors cursor-pointer";
      document.getElementById('tabDeparture').className = mode === 'departure' ? "flex-1 py-3 tab-active text-lg transition-colors cursor-pointer" : "flex-1 py-3 tab-inactive text-lg transition-colors cursor-pointer";
      applyLanguage(); 
    }

    function getCongestionBars(totalPax) {
      let filledBars = Math.min(Math.ceil(totalPax / 200), 10);
      if (totalPax > 0 && filledBars === 0) filledBars = 1;
      let colorClass = filledBars >= 7 ? 'bg-[#f97316]' : (filledBars >= 4 ? 'bg-[#fbbf24]' : 'bg-[#84cc16]'); 
      let barsHtml = '<div class="flex justify-center gap-1 mb-1">';
      for(let i=1; i<=10; i++) barsHtml += `<div class="w-1.5 h-4 ${i <= filledBars ? colorClass : 'bg-gray-100'} rounded-sm"></div>`;
      return barsHtml + '</div>';
    }

    function renderTable() {
      const tbody = document.getElementById('flightsTableBody');
      const isKoreaOnly = document.getElementById('koreaFilter').checked;
      const searchText = document.getElementById('searchInput').value.trim().toLowerCase();
      const t = dict[currentLang] || dict['ko'];
      
      let baseData = currentMode === 'arrival' ? dataArrivals : dataDepartures;
      
      if (isKoreaOnly) baseData = baseData.filter(f => f.isKorea);
      if (searchText) {
        baseData = baseData.filter(f => f.flight.toLowerCase().includes(searchText) || f.route.toLowerCase().includes(searchText) || f.time.includes(searchText));
      }

      if (baseData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-12 text-gray-400">${t.tdNoData}</td></tr>`;
        return;
      }
      
      tbody.innerHTML = '';
      baseData.forEach(target => {
        const [th, tm] = target.time.split(':').map(Number);
        const targetMins = th * 60 + tm;
        
        let concurrentCount = -1; 
        let maxPax = 0;

        baseData.forEach(f => {
          const fMins = f.time.split(':').map(Number)[0] * 60 + f.time.split(':').map(Number)[1];
          let diff = fMins - targetMins;
          if (diff < -720) diff += 1440;
          if (diff > 720) diff -= 1440;

          if (currentMode === 'arrival') {
            if (diff >= -60 && diff <= 10) { concurrentCount++; maxPax += f.seats; }
          } else {
            if (diff >= -120 && diff <= 120) { concurrentCount++; maxPax += f.seats; }
          }
        });

        const timeHtml = target.isDelayed 
          ? `<div class="font-bold text-red-500 text-lg">${target.time} <span class="text-xs font-normal text-gray-400 line-through">(${target.originalTime})</span></div>`
          : `<div class="font-bold text-gray-900 text-lg">${target.time}</div>`;

        tbody.insertAdjacentHTML('beforeend', `
          <tr class="hover:bg-gray-50/50 transition-colors">
            <td class="py-5 px-4 text-gray-700">${target.airline}</td>
            <td class="py-5 px-4"><span class="bg-gray-100 text-gray-700 font-bold px-3 py-1 rounded-md text-sm">${target.flight}</span></td>
            <td class="py-5 px-4 text-gray-700">${target.route}</td>
            <td class="py-5 px-4">${timeHtml}</td>
            <td class="py-5 px-4 text-sm text-gray-700">${t.strConcurrent.replace('{n}', concurrentCount)}</td>
            <td class="py-5 px-4">${getCongestionBars(maxPax)}<div class="text-gray-400 text-xs font-medium">${t.strPredictPax.replace('{n}', maxPax)}</div></td>
          </tr>
        `);
      });
    }

    async function fetchData() {
      const btn = document.getElementById('fetchBtn');
      btn.innerText = (dict[currentLang] || dict['ko']).fetchingBtn;
      
      const queryDate = document.getElementById('dateInput').value;
      
      try {
        const res = await fetch(`/api/hanoi-schedules?date=${queryDate}`);
        const result = await res.json();
        dataArrivals = result.arrivals;
        dataDepartures = result.departures;
        
        isTodayData = result.isToday; // 현재 상태 저장 (다국어 변환 시 사용)
        
        const alertBox = document.getElementById('alertNotice');
        if (isTodayData) {
          alertBox.className = "bg-green-50 border border-green-100 rounded-lg p-4 mb-6 text-sm text-green-800";
        } else {
          alertBox.className = "bg-blue-50 border border-blue-100 rounded-lg p-4 mb-6 text-sm text-blue-800";
        }
        
        applyLanguage(); // 다국어 사전에 맞게 알림 메시지 및 텍스트 갱신
      } catch (err) { 
        alert('데이터를 가져오는 중 오류가 발생했습니다.'); 
      } 
      finally { 
        btn.innerText = (dict[currentLang] || dict['ko']).fetchBtn; 
      }
    }

    // 방문자 카운트 통신
    async function recordVisit() {
      try {
        const res = await fetch('/api/visit');
        const data = await res.json();
        if (data.success) {
          document.getElementById('visitorCount').innerText = `오늘 방문자: ${data.daily}명 | 전체 방문자: ${data.total}명`;
        } else {
          document.getElementById('visitorCount').innerText = '';
        }
      } catch (err) {
        document.getElementById('visitorCount').innerText = '';
      }
    }

    document.getElementById('fetchBtn').addEventListener('click', fetchData);
    document.getElementById('koreaFilter').addEventListener('change', renderTable);
    document.getElementById('searchInput').addEventListener('input', renderTable);
    
    window.addEventListener('DOMContentLoaded', () => {
      fetchData();
      recordVisit();
    });
  </script>
</body>
</html>
